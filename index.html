<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Spatial Canvas Web</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
  <style>
    :root {
      --bg-dark: #070d18;
      --card-bg: #0e1726;
      --card-border: #1e293b;
      --cyan-accent: #00e5ff;
      --cyan-dim: rgba(0, 229, 255, 0.12);
      --amber-accent: #f59e0b;
      --green-status: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body { overscroll-behavior: none; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan-accent); outline-offset: 2px; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100dvh;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 601px) { body { border-inline: 1px solid var(--card-border); box-shadow: 0 0 40px #0005; } }

    /* Top Bar Header */
    .top-header {
      flex: 0 0 auto;
      padding: calc(env(safe-area-inset-top, 12px) + 6px) 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(7, 13, 24, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 20;
    }

    .title-group h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .title-group .sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-pill {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(14, 165, 233, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(14, 165, 233, 0.35);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 6px #38bdf8;
    }

    /* Map Region (Top 42-45%) */
    .map-container {
      position: relative;
      flex: 0 0 var(--map-size, 45%);
      min-height: 0;
      width: 100%;
      background: #0b1528;
      overflow: hidden;
      z-index: 16;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #0b1528;
    }

    .maplibregl-map { background: #0b1528; font-family: inherit; }
    .maplibregl-ctrl-attrib { background: #0f172ad9 !important; color: #cbd5e1 !important; font-size: 10px; }
    .maplibregl-ctrl-attrib a { color: #7dd3fc !important; }
    .maplibregl-ctrl-group { background: #0f172a; }
    .maplibregl-ctrl-group button { width: 44px; height: 44px; filter: invert(1); }
    .maplibregl-ctrl-bottom-right { right: 10px; bottom: 12px; z-index: 1200; pointer-events: auto; }
    .user-dot { z-index: 10; width: 44px; height: 44px; border: 12px solid transparent; border-radius: 50%; background: #38bdf8; background-clip: padding-box; box-shadow: 0 0 12px #38bdf8, 0 0 4px #e0f2fe; cursor: pointer; }
    .ble-marker { position: relative; width: 44px; height: 44px; border: 0; padding: 0; background: transparent; cursor: pointer; touch-action: manipulation; }
    .ble-core { position: absolute; top: 14px; left: 14px; display: block; width: 16px; height: 16px; border: 1.5px solid #fff; border-radius: 50%; background: var(--node-color); box-shadow: 0 0 10px var(--node-color); pointer-events: none; }
    .ble-label { position: absolute; left: 10px; top: 10px; display: grid; place-items: center; width: 24px; height: 24px; border: 1px solid #fff; border-radius: 50%; background: #0e1726; color: #f8fafc; font-size: 12px; font-weight: 700; box-shadow: 0 2px 10px #0008; }
    .ble-core { display: none; }
    .entity-popup .maplibregl-popup-content { background: #0e1726; border: 1px solid #334155; border-radius: 13px; color: #f8fafc; box-shadow: 0 8px 25px #0009; min-width: 218px; max-width: min(300px, 85vw); max-height: min(55dvh, 480px); overflow-y: auto; padding: 12px 14px; }
    .entity-popup .maplibregl-popup-tip { border-top-color: #0e1726; }
    .entity-popup .maplibregl-popup-close-button { color: #e2e8f0; font-size: 19px; padding: 2px 7px; }
    .entity-popup h3 { margin: 0 0 7px; color: #f8fafc; font-size: 15px; }
    .entity-popup .popup-role, .entity-popup .popup-tier { display: inline-block; margin-bottom: 8px; padding: 3px 7px; border-radius: 6px; background: #164e63; color: #a5f3fc; font-size: 11px; font-weight: 600; }
    .entity-popup .popup-tier { background: #334155; color: #e2e8f0; }
    .entity-popup p { margin: 4px 0; color: #cbd5e1; font-size: 11px; overflow-wrap: anywhere; }
    .entity-popup .popup-note { color: #94a3b8; font-size: 10px; }
    .entity-popup button, .entity-popup summary { min-height: 44px; }
    .entity-popup button { width: 100%; margin-top: 8px; border: 1px solid #0284c7; border-radius: 7px; background: transparent; color: #7dd3fc; font-size: 11px; font-weight: 700; cursor: pointer; }

    .map-toggles {
      position: absolute;
      top: 10px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      z-index: 1100;
      pointer-events: none;
    }
    .scan-controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }

    .scan-btn {
      pointer-events: auto;
      min-height: 44px;
      padding: 7px 12px;
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.9);
      color: #7dd3fc;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .scan-btn:disabled { opacity: .6; cursor: wait; }
    .squelch-btn[aria-pressed="true"] { border-color: #f59e0b; color: #fbbf24; }
    .view-btn[aria-pressed="true"] { border-color: #a78bfa; color: #c4b5fd; }
    .scan-status { position: absolute; top: 58px; left: 14px; right: 14px; z-index: 1100; width: fit-content; max-width: calc(100% - 28px); padding: 6px 10px; border-radius: 8px; background: #0f172ae8; color: #e2e8f0; font-size: .7rem; }
    .scan-status[hidden] { display: none; }
    @media (max-width: 520px) {
      .map-toggles { flex-wrap: wrap; }
      .scan-status { top: auto; bottom: 12px; }
    }

    .toggle-chip {
      pointer-events: auto;
      min-height: 44px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 7px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
    }

    .toggle-chip input[type="checkbox"] {
      appearance: none;
      width: 28px;
      height: 16px;
      background: #334155;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      outline: none;
      transition: 0.2s;
    }

    .toggle-chip input[type="checkbox"]:checked {
      background: #0284c7;
    }

    .toggle-chip input[type="checkbox"]::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    .toggle-chip input[type="checkbox"]:checked::after {
      left: 14px;
    }

    /* Bottom Sheet Panels (Bottom 56%) */
    .sheet-container {
      flex: 1 1 0;
      min-height: 0;
      background: var(--bg-dark);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      z-index: 15;
      overflow: hidden;
    }

    .sheet-handle {
      display: block;
      width: 38px;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      margin: 8px auto 6px;
    }

    .sheet-grip { flex: 0 0 28px; width: 100%; border: 0; background: transparent; touch-action: none; cursor: grab; }
    .sheet-grip:active { cursor: grabbing; }

    .sheet-header {
      padding: 6px 16px 8px;
    }

    .sheet-header .meta-tag {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .sheet-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Search & Filter Tabs */
    .search-bar {
      margin: 8px 16px;
      background: #131d2e;
      border: 1px solid #1e293b;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 8px;
    }

    .search-bar input {
      background: transparent;
      border: none;
      color: white;
      font-size: 0.82rem;
      width: 100%;
      outline: none;
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      padding: 0 16px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-pill {
      min-height: 44px;
      background: #111a2c;
      border: 1px solid #1e293b;
      color: var(--text-muted);
      font-size: 0.72rem;
      padding: 5px 12px;
      border-radius: 14px;
      white-space: nowrap;
    }

    .filter-pill.active {
      background: #0284c7;
      color: white;
      border-color: #38bdf8;
    }

    /* Cards Scroll Area */
    .cards-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 6px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .signal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .signal-card.live-node { border-left: 3px solid var(--signal-color, #64748b); }
    .signal-card.selected { border-color: #38bdf8; box-shadow: 0 0 0 1px #38bdf855; }
    .signal-card.stale { opacity: .62; }
    .signal-card[data-map-entity] { cursor: pointer; }

    .card-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-icon {
      width: 34px;
      height: 34px;
      background: #0369a1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .card-title h3 {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .card-title p {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .badge {
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .badge-detected {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-distance {
      background: #1e293b;
      color: #e2e8f0;
    }

    .badge-health {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }

    .badge-device-class {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-size: 0.65rem;
    }

    .mac-row {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-family: monospace;
      overflow-wrap: anywhere;
    }

    .hardware-explainer { color: #cbd5e1; font-size: .72rem; line-height: 1.4; }

    .signal-card[hidden], .empty-state[hidden] { display: none; }
    .empty-state { padding: 24px 12px; color: var(--text-muted); text-align: center; font-size: .8rem; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-header">
    <div class="title-group">
      <div class="sub">Facility Overview /</div>
      <h1>neighborhood</h1>
    </div>
    <div class="status-pill" id="connectionStatus" aria-live="polite">Locating GPS…</div>
  </header>

  <!-- Map Canvas & Overlays -->
  <div class="map-container">
    <div class="map-toggles">
      <label class="toggle-chip">
        <span>Live GPS</span>
        <input type="checkbox" id="liveToggle" checked>
      </label>
      <div class="scan-controls">
        <button class="scan-btn" id="scanBle" type="button" aria-pressed="false" title="Browser scanning covers Bluetooth Low Energy only">Start BLE Scan</button>
        <button class="scan-btn" id="exportSession" type="button">Export</button>
        <button class="scan-btn squelch-btn" id="squelchToggle" type="button" aria-pressed="false" title="Show all captured BLE signals">All RF</button>
        <button class="scan-btn view-btn" id="viewToggle" type="button" aria-pressed="false" title="Tilt map and show available building heights">3D View</button>
      </div>
    </div>
    <div class="scan-status" id="scanStatus" role="status" aria-live="polite" hidden></div>
    <div class="scan-status" id="captureStatus" role="status" aria-live="polite" style="top:auto;bottom:58px">Local capture: 0 packets</div>
    <div id="map" role="application" aria-label="Interactive dark street map showing your GPS position, accuracy, and walking trail"></div>
  </div>

  <!-- Bottom Sheet: Tracked Entities -->
  <section class="sheet-container" id="sheet" aria-label="Tracked entities">
    <button class="sheet-grip" id="sheetGrip" type="button" aria-label="Resize tracked entities sheet" aria-expanded="false"><span class="sheet-handle" aria-hidden="true"></span></button>
    <div class="sheet-header">
      <div class="meta-tag">BLE observations · marker positions are illustrative, not measured emitter locations</div>
      <h2>Observed devices <small id="releaseVersion">walk-test-1</small></h2>
    </div>

    <div class="search-bar">
      <svg width="14" height="14" fill="none" stroke="#94a3b8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke-width="2"/><path d="m21 21-4.35-4.35" stroke-width="2"/></svg>
      <input type="search" id="searchInput" placeholder="Search" aria-label="Search tracked entities">
    </div>

    <div class="filter-pills">
      <button type="button" class="filter-pill active" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="filter-pill" data-filter="media" aria-pressed="false">Media &amp; Displays</button>
      <button type="button" class="filter-pill" data-filter="wearable" aria-pressed="false">Wearables &amp; Tags</button>
      <button type="button" class="filter-pill" data-filter="iot" aria-pressed="false">Smart IoT</button>
      <button type="button" class="filter-pill" data-filter="unresolved" aria-pressed="false">Unresolved</button>
    </div>

    <div class="cards-list" id="cardsList">
      <p class="empty-state" id="emptyState">No signals yet. Tap Start BLE Scan to discover nearby devices.</p>
    </div>
  </section>

  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs';
    const cardsList = document.getElementById('cardsList');
    const cards = [];
    const filters = [...document.querySelectorAll('.filter-pill')];
    const search = document.getElementById('searchInput');
    const empty = document.getElementById('emptyState');
    const entities = new Map();
    let userPoint = null, lastFixAt = 0, selectedEntity = null, followGps = true;
    let activeFilter = 'all', proximityOnly = false;

    function updateCards() {
      const query = search.value.trim().toLocaleLowerCase();
      let visible = 0;
      for (const card of cards) {
        const entity = entities.get(card.dataset.mapEntity);
        card.hidden = (activeFilter !== 'all' && card.dataset.category !== activeFilter)
          || !card.textContent.toLocaleLowerCase().includes(query)
          || (proximityOnly && Number.isFinite(entity?.rssi) && entity.rssi < -75);
        if (!card.hidden) visible++;
      }
      const strongest = [...entities.values()]
        .filter(entity => entity.marker && !entity.card.hidden)
        .sort((a, b) => (Number.isFinite(b.rssi) ? b.rssi : -Infinity)
          - (Number.isFinite(a.rssi) ? a.rssi : -Infinity))
        .slice(0, 5);
      refreshSignalMap(strongest); // Map shows five strongest; every card remains in the scrollable list.
      for (const entity of entities.values()) {
        if (entity.card.hidden && entity.popup?.isOpen()) entity.popup.remove();
      }
      empty.textContent = cards.length ? 'No signals match these controls.'
        : 'No signals yet. Tap Start BLE Scan to discover nearby devices.';
      empty.hidden = visible > 0;
    }
    search.addEventListener('input', updateCards);
    function setFilter(value) {
      activeFilter = value;
      for (const button of filters) {
        const active = button.dataset.filter === value;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      }
      updateCards();
    }
    for (const filter of filters) filter.addEventListener('click', () => setFilter(filter.dataset.filter));

    const scanButton = document.getElementById('scanBle');
    const squelchButton = document.getElementById('squelchToggle');
    squelchButton.addEventListener('click', () => {
      proximityOnly = !proximityOnly;
      squelchButton.textContent = proximityOnly ? 'Proximity Only (≥ -75 dBm)' : 'All RF';
      squelchButton.setAttribute('aria-pressed', String(proximityOnly));
      squelchButton.title = proximityOnly
        ? 'Hide signals weaker than -75 dBm; tap for All RF'
        : 'Show all captured BLE signals; tap for Proximity Only';
      updateCards();
    });
    const scanStatus = document.getElementById('scanStatus');
    const bluetooth = navigator.bluetooth;
    const bleCards = new Map();
    const anonymousIds = new WeakMap();
    const watchedDevices = new Set();
    let bleScan = null, chooserOnly = false, anonymousCount = 0, sessionNumber = 0;
    const sessionStarted = new Date().toISOString();
    const interruptions = [];
    let packetCount = 0, droppedCount = 0, captureDb = null, scanState = 'stopped';
    const pendingWrites = new Set();
    const captureStatus = document.getElementById('captureStatus');
    const storageReady = new Promise(resolve => {
      if (!window.indexedDB) { resolve(null); return; }
      const request = indexedDB.open('spatial-canvas-walk-capture', 1);
      request.onupgradeneeded = () => request.result.createObjectStore('observations', { keyPath: 'sequence' });
      request.onsuccess = () => { captureDb = request.result; resolve(captureDb); };
      request.onerror = () => resolve(null);
    });

    function updateCaptureStatus() {
      captureStatus.textContent = `Local capture: ${packetCount} packets · ${droppedCount} lost${captureDb ? '' : ' · storage unavailable'}`;
    }
    storageReady.then(updateCaptureStatus);
    function setScanState(state, message) {
      scanState = state;
      scanButton.textContent = state === 'scanning' ? 'Stop BLE Scan' : state === 'requesting' ? 'Requesting…' : state === 'interrupted' ? 'Resume BLE Scan' : 'Start BLE Scan';
      scanButton.setAttribute('aria-pressed', String(state === 'scanning'));
      showScanStatus(`BLE ${state}: ${message}`);
    }
    function recordInterruption(reason) {
      interruptions.push({ at: new Date().toISOString(), reason });
    }

    function showScanStatus(message) {
      scanStatus.textContent = message;
      scanStatus.hidden = !message;
    }

    function normalizeUuid(value) {
      const uuid = String(value).toLowerCase().replace(/^0x/, '');
      return /^0000[0-9a-f]{4}-0000-1000-8000-00805f9b34fb$/.test(uuid)
        ? uuid.slice(4, 8) : uuid;
    }

    function bytesHex(value) {
      if (!value) return '';
      const bytes = value instanceof DataView
        ? new Uint8Array(value.buffer, value.byteOffset, value.byteLength)
        : value instanceof ArrayBuffer ? new Uint8Array(value)
          : ArrayBuffer.isView(value) ? new Uint8Array(value.buffer, value.byteOffset, value.byteLength) : null;
      return bytes ? [...bytes].map(byte => byte.toString(16).padStart(2, '0')).join('') : '';
    }

    function parseAdvertisement(device, event) {
      const data = event?.advertisementData || event || {};
      const serviceData = data.serviceData || event?.serviceData;
      const manufacturerData = data.manufacturerData || event?.manufacturerData;
      const serviceUuids = new Set([
        ...(Array.isArray(data.uuids) ? data.uuids : []),
        ...(Array.isArray(data.services) ? data.services : []),
        ...(Array.isArray(device?.uuids) ? device.uuids : []),
        ...(serviceData?.keys ? serviceData.keys() : [])
      ].map(normalizeUuid));
      const manufacturerIds = new Set();
      const manufacturerPayloads = {};
      const servicePayloads = {};
      if (serviceData?.entries) for (const [uuid, value] of serviceData.entries()) servicePayloads[normalizeUuid(uuid)] = bytesHex(value);
      let iBeacon = false;
      if (manufacturerData?.entries) {
        for (const [rawId, value] of manufacturerData.entries()) {
          const id = typeof rawId === 'number' ? rawId : Number(rawId) || Number.parseInt(rawId, 16);
          if (!Number.isFinite(id)) continue;
          manufacturerIds.add(id);
          manufacturerPayloads[`0x${id.toString(16).padStart(4, '0')}`] = bytesHex(value);
          if (id === 0x004c && value?.byteLength === 23 && value.getUint8) {
            iBeacon ||= value.getUint8(0) === 0x02 && value.getUint8(1) === 0x15;
          }
        }
      }
      return {
        name: data.name || event?.name || device?.name || '', serviceUuids, manufacturerIds,
        manufacturerPayloads, servicePayloads, iBeacon,
        rssi: Number.isFinite(data.rssi) ? data.rssi : Number.isFinite(event?.rssi) ? event.rssi : null,
        txPower: Number.isFinite(data.txPower) ? data.txPower : Number.isFinite(event?.txPower) ? event.txPower : null
      };
    }

    function classifySignal(info) {
      const name = info.name.toLowerCase();
      const has = uuid => info.serviceUuids.has(uuid);
      if (info.iBeacon) {
        return { category: 'unresolved', role: 'iBeacon frame', color: '#a78bfa', icon: 'BC',
          explainer: 'Recognised iBeacon frame: Apple company ID, 0x02 0x15 prefix and 23-byte payload. Emitter role unknown.' };
      }
      if (has('fe2c')) {
        return { category: 'unresolved', role: 'Fast Pair service', color: '#a78bfa', icon: 'FP',
          explainer: 'Recognised Google Fast Pair service UUID; accessory type and tracker status are unknown.' };
      }
      if (has('feaa')) {
        return { category: 'unresolved', role: 'Eddystone service', color: '#a78bfa', icon: 'BC',
          explainer: 'Recognised Eddystone service UUID; payload and device role are not decoded.' };
      }
      if (/(^|[^a-z])tv([^a-z]|$)|webos|display|cast/i.test(name)) {
        return { category: 'media', role: 'Possible display (name only)', color: '#00e5ff', icon: 'AV',
          explainer: 'Tentative role from advertised name only; identity and capabilities unverified.' };
      }
      if (/\b(watch|wearable|tag|tracker|airtag|tile)\b/i.test(name)) {
        return { category: 'wearable', role: 'Possible wearable or tag (name only)', color: '#a78bfa', icon: 'WT',
          explainer: 'Tentative role from advertised name only; it does not establish a tracker identity.' };
      }
      if (/\b(light|bulb|sensor|hub|gateway)\b/i.test(name)) {
        return { category: 'iot', role: 'Possible IoT device (name only)', color: '#f59e0b', icon: 'IoT',
          explainer: 'Tentative role from advertised name only; location and function unverified.' };
      }
      return { category: 'unresolved', role: 'Unresolved Radio Node', color: '#64748b', icon: 'RF',
        explainer: info.manufacturerIds.size
          ? 'Proprietary BLE manufacturer payload has no recognized plain-text device role.'
          : info.name
            ? 'BLE device advertises a name without a recognized service signature.'
            : 'Anonymous BLE advertisement has no readable name or recognized service signature.' };
    }

    function signalMetrics(rssi) {
      if (!Number.isFinite(rssi)) return { tier: 'Signal unavailable', radius: 8 };
      return { tier: rssi >= -65 ? 'Strong signal' : rssi >= -85 ? 'Moderate signal' : 'Weak signal', radius: 8 };
    }

    function currentGpsPoint() {
      return live.checked && userPoint && Date.now() - lastFixAt <= 15000
        ? { lat: userPoint.lat, lng: userPoint.lng } : null;
    }

    function mergeSignal(device, observed, receivedAt = null) {
      const browserId = device?.id || '';
      let key = browserId;
      if (!browserId && device) {
        if (!anonymousIds.has(device)) anonymousIds.set(device, `anonymous-${++anonymousCount}`);
        key = anonymousIds.get(device);
      }
      key ||= 'anonymous-advertisement';
      let record = bleCards.get(key);
      if (!record) {
        const card = document.createElement('article');
        card.className = 'signal-card live-node';
        const top = document.createElement('div');
        top.className = 'card-top';
        const icon = document.createElement('div');
        icon.className = 'card-icon';
        const titleGroup = document.createElement('div');
        titleGroup.className = 'card-title';
        const title = document.createElement('h3');
        const subtitle = document.createElement('p');
        titleGroup.append(title, subtitle);
        top.append(icon, titleGroup);
        const badges = document.createElement('div');
        badges.className = 'badge-row';
        const detected = document.createElement('span');
        detected.className = 'badge badge-detected';
        detected.textContent = 'Selected; no advertisement received';
        const tier = document.createElement('span');
        tier.className = 'badge badge-distance';
        const health = document.createElement('span');
        health.className = 'badge badge-health';
        const rssi = document.createElement('span');
        rssi.className = 'badge badge-device-class';
        badges.append(detected, tier, health, rssi);
        const idRow = document.createElement('div');
        idRow.className = 'mac-row';
        const explainer = document.createElement('p');
        explainer.className = 'hardware-explainer';
        card.append(top, badges, idRow, explainer);
        cardsList.insertBefore(card, empty);
        cards.push(card);
        const entity = { id: `ble-${key}`, number: ++sessionNumber, card, browserId, origin: currentGpsPoint(),
          locationDelayed: false,
          layoutAngle: (hashId(`ble-${key}`) % 360 + (compassHeading ?? 0)) % 360 };
        entities.set(entity.id, entity);
        makeCardInteractive(entity);
        record = { card, icon, title, subtitle, tier, health, rssi, detected, idRow, explainer, entity,
          info: { name: '', serviceUuids: new Set(), manufacturerIds: new Set(), iBeacon: false,
            manufacturerPayloads: {}, servicePayloads: {}, rssi: null, rawRssi: null, txPower: null,
            firstSeen: null, lastSeen: null, packets: 0 } };
        bleCards.set(key, record);
      }
      const info = record.info;
      if (receivedAt) {
        info.firstSeen ||= receivedAt;
        info.lastSeen = receivedAt;
        info.packets++;
      }
      info.name = observed.name || info.name;
      for (const uuid of observed.serviceUuids) info.serviceUuids.add(uuid);
      for (const id of observed.manufacturerIds) info.manufacturerIds.add(id);
      info.iBeacon ||= observed.iBeacon;
      Object.assign(info.manufacturerPayloads, observed.manufacturerPayloads);
      Object.assign(info.servicePayloads, observed.servicePayloads);
      if (observed.rssi !== null) {
        info.rawRssi = observed.rssi;
        info.rssi = info.rssi === null ? observed.rssi : .25 * observed.rssi + .75 * info.rssi;
      }
      if (observed.txPower !== null) info.txPower = observed.txPower;
      return record;
    }

    function renderSignalRecord(record) {
      const { info } = record;
      const classification = classifySignal(info);
      const metrics = signalMetrics(info.rssi);
      const entity = record.entity;
      const labelChanged = entity.name !== (info.name || 'Unnamed BLE device')
        || entity.color !== classification.color;
      Object.assign(entity, classification, metrics, {
        name: info.name || 'Unnamed BLE device', rssi: info.rssi, rawRssi: info.rawRssi,
        txPower: info.txPower, serviceUuids: [...info.serviceUuids], manufacturerIds: [...info.manufacturerIds],
        manufacturerPayloads: { ...info.manufacturerPayloads }, servicePayloads: { ...info.servicePayloads },
        firstSeen: info.firstSeen, lastSeen: info.lastSeen, packets: info.packets
      });
      if (!entity.origin) {
        entity.origin = currentGpsPoint();
      }
      reserveSignalAngle(entity);
      const gps = currentGpsPoint();
      const gpsMoved = gps && entity.origin && distanceMeters(entity.origin, gps) > 4;
      if (gpsMoved) entity.origin = gps;
      const signalMoved = Number.isFinite(entity.rssi)
        && (!Number.isFinite(entity.visualRssi) || Math.abs(entity.rssi - entity.visualRssi) > 4);
      const reposition = entity.origin && (!entity.location || gpsMoved || signalMoved);
      if (reposition) {
        entity.displayRadius = Number.isFinite(entity.radius) ? entity.radius : 8;
        entity.location = offsetPoint(entity.origin, entity.displayRadius, entity.layoutAngle);
        entity.visualRssi = entity.rssi;
      }
      record.card.dataset.category = entity.category;
      record.card.style.setProperty('--signal-color', entity.color);
      record.card.setAttribute('aria-label', `Show ${entity.name} on map`);
      record.icon.textContent = entity.icon;
      record.icon.style.background = entity.color;
      record.title.textContent = `#${entity.number} ${entity.name}`;
      record.subtitle.textContent = entity.role;
      record.tier.textContent = entity.tier;
      record.health.textContent = entity.rawRssi === null ? 'Raw RSSI unavailable' : `Raw ${entity.rawRssi} dBm`;
      record.rssi.textContent = entity.rssi === null ? 'Smoothed RSSI unavailable' : `Smoothed ${Math.round(entity.rssi)} dBm`;
      record.idRow.textContent = `Browser ID: ${entity.browserId || 'Unavailable'} (not a MAC)`;
      const ageSeconds = info.lastSeen ? Math.floor((Date.now() - Date.parse(info.lastSeen)) / 1000) : null;
      record.detected.textContent = ageSeconds === null ? 'Selected; no advertisement received'
        : `${ageSeconds < 60 ? `${ageSeconds}s` : `${Math.floor(ageSeconds / 60)}m`} ago · ${info.packets} packets`;
      record.card.classList.toggle('stale', ageSeconds !== null && ageSeconds > 30);
      record.explainer.textContent = entity.explainer;
      if (reposition || labelChanged) renderEntityNode(entity);
    }

    const changedRecords = new Set();
    function queueAdvertisement(device, event) {
      const receivedAt = new Date().toISOString();
      const observed = parseAdvertisement(device, event);
      const record = mergeSignal(device, observed, event ? receivedAt : null);
      changedRecords.add(record);
      if (!event) return;
      const sequence = ++packetCount;
      const gps = currentGpsPoint();
      const packet = { sequence: `${sessionStarted}/${String(sequence).padStart(12, '0')}`,
        receivedAt, number: record.entity.number, browserId: device?.id || null,
        name: observed.name, rssi: observed.rssi, txPower: observed.txPower,
        serviceUuids: [...observed.serviceUuids], manufacturerData: observed.manufacturerPayloads,
        serviceData: observed.servicePayloads,
        scannerGps: gps ? { ...gps, accuracyMeters: lastAccuracy, fixAgeMs: Date.now() - lastFixAt } : null };
      const write = storageReady.then(db => new Promise((resolve, reject) => {
        if (!db) { reject(new Error('Storage unavailable')); return; }
        const tx = db.transaction('observations', 'readwrite');
        tx.objectStore('observations').put(packet);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      })).catch(() => { droppedCount++; }).finally(() => { pendingWrites.delete(write); updateCaptureStatus(); });
      pendingWrites.add(write);
      updateCaptureStatus();
    }

    function flushAdvertisements() {
      for (const record of changedRecords) renderSignalRecord(record);
      changedRecords.clear();
      for (const record of bleCards.values()) if (record.info.lastSeen) renderSignalRecord(record);
      updateCards();
    }
    const scanTick = window.setInterval(flushAdvertisements, 2500);

    function onAdvertisement(event) {
      queueAdvertisement(event.device || (event.currentTarget !== bluetooth ? event.currentTarget : null), event);
    }

    function stopBleScan() {
      try { bleScan?.stop(); } catch { /* Already stopped by browser. */ }
      bleScan = null;
      bluetooth?.removeEventListener('advertisementreceived', onAdvertisement);
      for (const device of watchedDevices) {
        device.removeEventListener('advertisementreceived', onAdvertisement);
        try { device.unwatchAdvertisements?.(); } catch { /* Already stopped. */ }
      }
      watchedDevices.clear();
      flushAdvertisements();
      setScanState('stopped', 'Capture preserved locally.');
    }

    async function scanBle() {
      if (scanState === 'scanning') { stopBleScan(); return; }
      if (!bluetooth?.requestDevice) {
        setScanState('unavailable', 'Use Chrome on Android over HTTPS.');
        return;
      }
      scanButton.disabled = true;
      setScanState('requesting', 'Waiting for browser permission or device picker.');
      try {
        if (typeof bluetooth.requestLEScan === 'function' && !chooserOnly) {
          bleScan = await bluetooth.requestLEScan({ acceptAllAdvertisements: true, keepRepeatedDevices: true });
          bluetooth.addEventListener('advertisementreceived', onAdvertisement);
          setScanState('scanning', 'Receiving advertisements.');
          if (document.hidden) {
            stopBleScan();
            recordInterruption('Page hidden during permission request');
            setScanState('interrupted', 'Page hidden; tap Resume after returning.');
          }
        } else {
          const device = await bluetooth.requestDevice({ acceptAllDevices: true });
          queueAdvertisement(device, null);
          if (typeof device.watchAdvertisements === 'function') {
            device.addEventListener('advertisementreceived', onAdvertisement);
            watchedDevices.add(device);
            try {
              await device.watchAdvertisements();
              setScanState('scanning', 'Watching selected device advertisements.');
              if (document.hidden) {
                stopBleScan();
                recordInterruption('Page hidden during device watch request');
                setScanState('interrupted', 'Page hidden; tap Resume after returning.');
              }
            } catch {
              device.removeEventListener('advertisementreceived', onAdvertisement);
              watchedDevices.delete(device);
              setScanState('stopped', 'Selected; no advertisement received.');
            }
          } else {
            setScanState('stopped', 'Selected; no advertisement received.');
          }
        }
      } catch (error) {
        if (error.name === 'NotSupportedError' || error.name === 'NotAllowedError') {
          chooserOnly = true;
          setScanState('unavailable', 'Broad scan denied or unsupported; tap to choose one device.');
        } else if (error.name === 'NotFoundError') {
          setScanState('stopped', 'No device selected.');
        } else {
          setScanState('interrupted', 'Check Bluetooth and site permissions; tap to resume.');
          recordInterruption(error.name || 'Scan failed');
        }
      } finally {
        scanButton.disabled = false;
      }
    }

    scanButton.addEventListener('click', scanBle);
    document.getElementById('exportSession').addEventListener('click', async () => {
      const button = document.getElementById('exportSession');
      button.disabled = true;
      try {
        flushAdvertisements();
        const exportCount = packetCount;
        await Promise.all([...pendingWrites]);
        const db = await storageReady;
        const observations = [];
        if (db) await new Promise((resolve, reject) => {
          const tx = db.transaction('observations', 'readonly');
          const cursor = tx.objectStore('observations').openCursor();
          cursor.onsuccess = () => {
            if (!cursor.result) return;
            if (cursor.result.value.sequence.startsWith(`${sessionStarted}/`)
                && Number(cursor.result.value.sequence.split('/')[1]) <= exportCount) observations.push(cursor.result.value);
            cursor.result.continue();
          };
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
        const devices = [...bleCards.values()].map(({ entity }) => ({
          number: entity.number, browserId: entity.browserId || null, name: entity.name,
          category: entity.category, role: entity.role, evidence: entity.explainer,
          firstSeen: entity.firstSeen, lastSeen: entity.lastSeen, packetCount: entity.packets,
          rawRssi: entity.rawRssi, smoothedRssi: entity.rssi, txPower: entity.txPower,
          serviceUuids: entity.serviceUuids, manufacturerIds: entity.manufacturerIds,
          manufacturerData: entity.manufacturerPayloads, serviceData: entity.servicePayloads
        }));
        const exportData = { version: 'walk-test-1', sessionStarted, exportedAt: new Date().toISOString(),
          scope: 'Browser-delivered BLE advertisements only',
          note: 'Browser IDs are not MAC addresses. GPS is scanner position, not emitter position. Marker positions are illustrative.',
          packetCount: exportCount, retainedCount: observations.length, droppedCount,
          interruptions, devices, observations };
        const url = URL.createObjectURL(new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = `ble-walk-${sessionStarted.replace(/[:.]/g, '-')}.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        showScanStatus(`Exported ${observations.length} observations; ${droppedCount} lost.`);
      } catch (error) {
        showScanStatus(`Export failed: ${error.message || 'storage read error'}`);
      } finally { button.disabled = false; }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && scanState === 'scanning') {
        stopBleScan();
        recordInterruption('Page hidden or screen locked');
        setScanState('interrupted', 'Page hidden; tap Resume after returning.');
      }
    });
    window.addEventListener('pagehide', () => {
      if (scanState === 'scanning') recordInterruption('Page closed or navigated');
      stopBleScan();
    });

    function makeCardInteractive(entity) {
      entity.card.dataset.mapEntity = entity.id;
      entity.card.tabIndex = 0;
      entity.card.setAttribute('role', 'button');
      entity.card.setAttribute('aria-label', `Show ${entity.name || 'BLE device'} on map`);
      entity.card.addEventListener('click', () => selectEntity(entity, true));
      entity.card.addEventListener('keydown', event => {
        if (event.target === entity.card && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          selectEntity(entity, true);
        }
      });
    }

    function hashId(value) {
      let hash = 2166136261;
      for (const character of value) hash = Math.imul(hash ^ character.charCodeAt(0), 16777619);
      return hash >>> 0;
    }

    function offsetPoint(point, meters, bearing) {
      const distance = meters / 6378137;
      const heading = bearing * Math.PI / 180;
      const lat = point.lat * Math.PI / 180;
      const lng = point.lng * Math.PI / 180;
      const nextLat = Math.asin(Math.sin(lat) * Math.cos(distance)
        + Math.cos(lat) * Math.sin(distance) * Math.cos(heading));
      const nextLng = lng + Math.atan2(Math.sin(heading) * Math.sin(distance) * Math.cos(lat),
        Math.cos(distance) - Math.sin(lat) * Math.sin(nextLat));
      return { lat: nextLat * 180 / Math.PI, lng: nextLng * 180 / Math.PI };
    }

    function circleFeature(center, radius, properties = {}) {
      const coordinates = [];
      for (let step = 0; step <= 48; step++) {
        const point = offsetPoint(center, radius, step * 360 / 48);
        coordinates.push([point.lng, point.lat]);
      }
      return { type: 'Feature', properties, geometry: { type: 'Polygon', coordinates: [coordinates] } };
    }

    function collection(features = []) { return { type: 'FeatureCollection', features }; }
    function putGeoJson(sourceId, data) { map?.getSource(sourceId)?.setData(data); }

    function reserveSignalAngle(entity) {
      if (!entity.origin || entity.angleReserved) return;
      const peers = [...entities.values()].filter(other => other !== entity && other.angleReserved
        && other.origin && distanceMeters(other.origin, entity.origin) < 1);
      const minimumGap = Math.min(40, 288 / (peers.length + 1));
      let angle = entity.layoutAngle;
      for (let attempt = 0; attempt < 360; attempt++) {
        if (peers.every(other => Math.abs((angle - other.layoutAngle + 540) % 360 - 180) >= minimumGap)) break;
        angle = (angle + 137.507764) % 360;
      }
      entity.layoutAngle = angle;
      entity.angleReserved = true;
    }

    function renderEntityNode(entity) {
      if (!map || !entity.location) return;
      if (!entity.marker) {
        const element = document.createElement('button');
        element.type = 'button';
        element.className = 'ble-marker';
        const core = document.createElement('span');
        core.className = 'ble-core';
        const label = document.createElement('span');
        label.className = 'ble-label';
        element.append(core, label);
        element.addEventListener('click', event => { event.stopPropagation(); selectEntity(entity); });
        entity.marker = new maplibregl.Marker({ element, anchor: 'center' });
      }
      const element = entity.marker.getElement();
      const shortId = entity.browserId ? entity.browserId.slice(-4) : entity.id.slice(-4);
      element.querySelector('.ble-label').textContent = String(entity.number);
      element.setAttribute('aria-label', `Inspect observation ${entity.number}: ${entity.name}`);
      element.style.setProperty('--node-color', entity.color);
      const angle = entity.layoutAngle;
      element.dataset.side = angle >= 45 && angle < 135 ? 'east'
        : angle >= 135 && angle < 225 ? 'south'
          : angle >= 225 && angle < 315 ? 'west' : 'north';
      entity.marker.setLngLat([entity.location.lng, entity.location.lat]);
    }

    let lastSignalMapSignature = '';
    function refreshSignalMap(strongest) {
      if (!map) return;
      const visible = new Set(strongest);
      for (const entity of entities.values()) {
        if (!entity.marker) continue;
        if (visible.has(entity) && !entity.markerVisible) {
          entity.marker.addTo(map);
          entity.markerVisible = true;
        } else if (!visible.has(entity) && entity.markerVisible) {
          entity.marker.remove();
          entity.markerVisible = false;
        }
      }
      if (!mapReady) return;
      const signature = strongest.map(entity => [entity.id, entity.color,
        entity.origin?.lat, entity.origin?.lng, entity.location?.lat, entity.location?.lng,
        entity.displayRadius, Number.isFinite(entity.visualRssi)].join(':')).sort().join('|');
      if (signature === lastSignalMapSignature) return;
      lastSignalMapSignature = signature;
      putGeoJson('signal-rings', collection(strongest
        .filter(entity => entity.origin && Number.isFinite(entity.visualRssi) && Number.isFinite(entity.displayRadius))
        .map(entity => circleFeature(entity.origin, entity.displayRadius, { id: entity.id, color: entity.color }))));
      putGeoJson('signal-rays', collection(strongest
        .filter(entity => entity.origin && entity.location)
        .map(entity => ({ type: 'Feature', properties: { id: entity.id, color: entity.color },
          geometry: { type: 'LineString', coordinates: [
            [entity.origin.lng, entity.origin.lat], [entity.location.lng, entity.location.lat]
          ] } }))));
    }

    function openEntityPopup(entity) {
      if (!map || !entity.location) return;
      const content = document.createElement('div');
      const heading = document.createElement('h3');
      heading.textContent = `#${entity.number} ${entity.name}`;
      const role = document.createElement('span');
      role.className = 'popup-role';
      role.style.color = entity.color;
      role.textContent = entity.role;
      const health = document.createElement('p');
      health.textContent = `Raw RSSI: ${Number.isFinite(entity.rawRssi) ? `${entity.rawRssi} dBm` : 'Unavailable'}`;
      const rssi = document.createElement('p');
      rssi.textContent = `Smoothed RSSI: ${Number.isFinite(entity.rssi) ? `${Math.round(entity.rssi)} dBm` : 'Pending'}`;
      const tier = document.createElement('span');
      tier.className = 'popup-tier';
      tier.textContent = `${entity.tier} (RSSI band, not distance)`;
      const hardware = document.createElement('p');
      hardware.textContent = 'Broadcast MAC: Not exposed by Web Bluetooth';
      content.append(heading, role, health, rssi, tier, hardware);
      const browserId = document.createElement('p');
      browserId.textContent = `Browser-assigned ID: ${entity.browserId || 'Unavailable'}`;
      const services = document.createElement('p');
      services.textContent = `Advertised service UUIDs: ${entity.serviceUuids.length ? entity.serviceUuids.join(', ') : 'Not exposed'}`;
      const manufacturers = document.createElement('p');
      manufacturers.textContent = `Manufacturer IDs: ${entity.manufacturerIds.length ? entity.manufacturerIds.map(id => `0x${id.toString(16).padStart(4, '0')}`).join(', ') : 'Not exposed'}`;
      const times = document.createElement('p');
      times.textContent = `First seen: ${entity.firstSeen || 'No advertisement'} · Last seen: ${entity.lastSeen || 'No advertisement'} · Packets: ${entity.packets || 0}`;
      const txPower = document.createElement('p');
      txPower.textContent = `Advertised Tx power: ${Number.isFinite(entity.txPower) ? `${entity.txPower} dBm` : 'Not exposed'}`;
      const explainer = document.createElement('p');
      explainer.textContent = `Evidence: ${entity.explainer}`;
      content.append(browserId, services, manufacturers, times, txPower, explainer);
      const payloads = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = 'Exposed payload bytes';
      const payloadText = document.createElement('p');
      payloadText.textContent = `Manufacturer: ${JSON.stringify(entity.manufacturerPayloads || {})}\nService: ${JSON.stringify(entity.servicePayloads || {})}`;
      payloadText.style.whiteSpace = 'pre-wrap';
      payloads.append(summary, payloadText);
      content.append(payloads);
      const note = document.createElement('p');
      note.className = 'popup-note';
      note.textContent = entity.locationDelayed
        ? 'Illustrative marker uses a GPS fix after detection. It is not a measured emitter location.'
        : 'Illustrative marker bearing and offset are for spacing. They are not a measured emitter location or distance.';
      content.append(note);
      const focusButton = document.createElement('button');
      focusButton.type = 'button';
      focusButton.textContent = 'Focus in List';
      focusButton.addEventListener('click', () => focusInList(entity));
      content.append(focusButton);
      const previous = entity.popup;
      entity.popup = null;
      previous?.remove();
      const popup = new maplibregl.Popup({ className: 'entity-popup', maxWidth: '270px',
        offset: 12, closeOnClick: false })
        .setLngLat([entity.location.lng, entity.location.lat]).setDOMContent(content);
      entity.popup = popup;
      popup.on('close', () => {
        if (entity.popup === popup && selectedEntity === entity) {
          entity.card.classList.remove('selected');
          selectedEntity = null;
        }
      });
      popup.addTo(map);
    }

    function dismissPopup() {
      if (!selectedEntity) return;
      const entity = selectedEntity;
      selectedEntity = null;
      entity.card.classList.remove('selected');
      entity.popup?.remove();
    }

    function focusInList(entity) {
      search.value = '';
      setFilter('all');
      setMapSize(18);
      requestAnimationFrame(() => {
        entity.card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        entity.card.focus({ preventScroll: true });
      });
    }

    function selectEntity(entity, fly = false) {
      if (selectedEntity === entity && entity.popup?.isOpen()) {
        dismissPopup();
        return;
      }
      dismissPopup();
      selectedEntity = entity;
      entity.card.classList.add('selected');
      followGps = false;
      if (!map || !entity.location) {
        showScanStatus('Waiting for GPS to place this map node.');
        return;
      }
      if (fly) {
        map.once('moveend', () => {
          if (selectedEntity === entity) openEntityPopup(entity);
        });
        map.flyTo({ center: [entity.location.lng, entity.location.lat], zoom: 19, duration: 700 });
      } else {
        openEntityPopup(entity);
      }
    }

    const live = document.getElementById('liveToggle');
    const status = document.getElementById('connectionStatus');
    const viewButton = document.getElementById('viewToggle');
    let map, mapReady = false, watchId = null, userDot, lastAccuracy = 0;
    let compassHeading = null, view3d = false, lastHeadingUpdateAt = 0;
    const trailPoints = [];

    function setViewMode(enabled) {
      view3d = enabled;
      viewButton.textContent = enabled ? '2D View' : '3D View';
      viewButton.setAttribute('aria-pressed', String(enabled));
      if (!map) return;
      if (mapReady) map.setLayoutProperty('3d-buildings', 'visibility', enabled ? 'visible' : 'none');
      map.easeTo({ pitch: enabled ? 58 : 0,
        bearing: enabled ? (compassHeading ?? -20) : 0, duration: 700 });
    }

    async function requestCompassPermission() {
      if (typeof window.DeviceOrientationEvent?.requestPermission !== 'function') return;
      try { await DeviceOrientationEvent.requestPermission(true); } catch { /* Sensor remains optional. */ }
    }

    viewButton.addEventListener('click', () => {
      requestCompassPermission();
      setViewMode(!view3d);
    });

    function updateHeading(event) {
      const measured = Number.isFinite(event.webkitCompassHeading)
        ? event.webkitCompassHeading
        : event.absolute && Number.isFinite(event.alpha)
          ? 360 - event.alpha + (screen.orientation?.angle || 0) : null;
      if (!Number.isFinite(measured)) return;
      const nextHeading = ((measured % 360) + 360) % 360;
      const change = compassHeading === null ? 360
        : Math.abs((nextHeading - compassHeading + 540) % 360 - 180);
      if (change < 2 && Date.now() - lastHeadingUpdateAt < 200) return;
      compassHeading = nextHeading;
      lastHeadingUpdateAt = Date.now();
      updateUserShapes();
    }
    window.addEventListener('deviceorientation', updateHeading);
    window.addEventListener('deviceorientationabsolute', updateHeading);

    function updateUserShapes() {
      if (!mapReady || !userPoint) return;
      putGeoJson('user-accuracy', collection(lastAccuracy > 0
        ? [circleFeature(userPoint, lastAccuracy)] : []));
      putGeoJson('walking-trail', collection(trailPoints.length > 1 ? [{ type: 'Feature',
        properties: {}, geometry: { type: 'LineString', coordinates: trailPoints } }] : []));
      putGeoJson('heading-beam', collection(Number.isFinite(compassHeading)
        ? [{ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [[
          [userPoint.lng, userPoint.lat],
          ...Array.from({ length: 13 }, (_, index) => {
            const point = offsetPoint(userPoint, 25, compassHeading - 24 + index * 4);
            return [point.lng, point.lat];
          }),
          [userPoint.lng, userPoint.lat]
        ]] } }] : []));
    }

    try {
      map = new maplibregl.Map({ container: 'map',
          style: 'https://tiles.openfreemap.org/styles/dark',
          center: [0, 0], zoom: 2, pitch: 0, maxPitch: 70,
          interactive: true, cooperativeGestures: false,
          touchZoomRotate: true, scrollZoom: true, doubleClickZoom: true,
          canvasContextAttributes: { antialias: true } });
      map.addControl(new maplibregl.NavigationControl({ showZoom: true, showCompass: true }), 'bottom-right');
      for (const button of map.getContainer().querySelectorAll('.maplibregl-ctrl-zoom-in, .maplibregl-ctrl-zoom-out')) {
        button.addEventListener('click', () => { followGps = false; });
      }
      let suppressGestureClickUntil = 0, multiTouchActive = false;
      const noteMultiTouch = event => {
        if (event.touches.length > 1) {
          multiTouchActive = true;
          suppressGestureClickUntil = Date.now() + 700;
          followGps = false;
        }
      };
      const canvas = map.getCanvasContainer();
      canvas.addEventListener('touchstart', noteMultiTouch, { passive: true });
      canvas.addEventListener('touchmove', noteMultiTouch, { passive: true });
      canvas.addEventListener('wheel', () => { followGps = false; }, { passive: true });
      canvas.addEventListener('dblclick', () => { followGps = false; });
      canvas.addEventListener('touchend', event => {
        if (multiTouchActive) {
          suppressGestureClickUntil = Date.now() + 700;
          if (event.touches.length === 0) multiTouchActive = false;
        }
      }, { passive: true });
      canvas.addEventListener('touchcancel', () => {
        multiTouchActive = false;
        suppressGestureClickUntil = Date.now() + 700;
      }, { passive: true });
      map.on('load', () => {
          const emptyData = collection();
          for (const name of ['heading-beam', 'user-accuracy', 'walking-trail', 'signal-rings', 'signal-rays']) {
            map.addSource(name, { type: 'geojson', data: emptyData });
          }
          map.addLayer({ id: 'heading-beam', type: 'fill', source: 'heading-beam',
            paint: { 'fill-color': '#38bdf8', 'fill-opacity': .25 } });
          map.addLayer({ id: 'user-accuracy', type: 'fill', source: 'user-accuracy',
            paint: { 'fill-color': '#38bdf8', 'fill-opacity': .1, 'fill-outline-color': '#38bdf8' } });
          map.addLayer({ id: 'walking-trail', type: 'line', source: 'walking-trail',
            paint: { 'line-color': '#38bdf8', 'line-width': 4, 'line-opacity': .9 } });
          map.addLayer({ id: 'signal-rings', type: 'fill', source: 'signal-rings',
            paint: { 'fill-color': ['get', 'color'], 'fill-opacity': .16,
              'fill-outline-color': ['get', 'color'] } });
          map.addLayer({ id: 'signal-rays', type: 'line', source: 'signal-rays',
            paint: { 'line-color': ['get', 'color'], 'line-width': 1.5, 'line-opacity': .7,
              'line-dasharray': [2, 2] } });
          map.on('click', event => {
            if (multiTouchActive || Date.now() < suppressGestureClickUntil) return;
            const ring = map.queryRenderedFeatures(event.point, { layers: ['signal-rings'] })[0];
            const entity = entities.get(ring?.properties?.id);
            if (entity) selectEntity(entity);
            else dismissPopup();
          });
          map.on('mouseenter', 'signal-rings', () => { map.getCanvas().style.cursor = 'pointer'; });
          map.on('mouseleave', 'signal-rings', () => { map.getCanvas().style.cursor = ''; });
          map.addSource('building-heights', { type: 'vector', url: 'https://tiles.openfreemap.org/planet' });
          const firstLabel = map.getStyle().layers.find(layer => layer.type === 'symbol' && layer.layout?.['text-field'])?.id;
          map.addLayer({ id: '3d-buildings', type: 'fill-extrusion', source: 'building-heights',
            'source-layer': 'building', minzoom: 15,
            filter: ['!=', ['get', 'hide_3d'], true],
            layout: { visibility: view3d ? 'visible' : 'none' },
            paint: { 'fill-extrusion-color': '#4b6078', 'fill-extrusion-opacity': .82,
              'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 0],
              'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0] } }, firstLabel);
          mapReady = true;
          updateUserShapes();
          updateCards();
      });
    } catch { status.textContent = '3D map unavailable'; }

    function distanceMeters(a, b) {
      const latDelta = (b.lat - a.lat) * Math.PI / 180;
      const lngDelta = (b.lng - a.lng) * Math.PI / 180;
      const x = Math.sin(latDelta / 2) ** 2 + Math.cos(a.lat * Math.PI / 180)
        * Math.cos(b.lat * Math.PI / 180) * Math.sin(lngDelta / 2) ** 2;
      return 12756274 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }

    function onPosition(position) {
      if (!live.checked || !map) return;
      const { latitude, longitude, accuracy } = position.coords;
      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return;
      const firstFix = !userDot;
      const point = { lat: latitude, lng: longitude };
      userPoint = point;
      lastFixAt = Date.now();
      lastAccuracy = Number.isFinite(accuracy) ? Math.max(0, accuracy) : 0;
      if (!userDot) {
        const element = document.createElement('button');
        element.type = 'button';
        element.className = 'user-dot';
        element.setAttribute('aria-label', 'Your location; tap to follow and enable compass');
        element.addEventListener('click', event => {
          event.stopPropagation();
          requestCompassPermission();
          followGps = true;
          dismissPopup();
          map.flyTo({ center: [userPoint.lng, userPoint.lat], zoom: 18 });
        });
        userDot = new maplibregl.Marker({ element, anchor: 'center' })
          .setLngLat([point.lng, point.lat]).addTo(map);
      } else {
        userDot.setLngLat([point.lng, point.lat]);
      }
      let anchoredPendingNode = false;
      for (const entity of entities.values()) {
        if (!entity.origin) {
          entity.origin = { lat: point.lat, lng: point.lng };
          entity.locationDelayed = true;
          reserveSignalAngle(entity);
          entity.displayRadius = Number.isFinite(entity.radius) ? entity.radius : 8;
          entity.location = offsetPoint(entity.origin, entity.displayRadius, entity.layoutAngle);
          entity.visualRssi = entity.rssi;
          renderEntityNode(entity);
          anchoredPendingNode = true;
        }
      }
      if (anchoredPendingNode) updateCards();
      const lastTrail = trailPoints.at(-1);
      if (!lastTrail || distanceMeters({ lat: lastTrail[1], lng: lastTrail[0] }, point) >= 3) {
        trailPoints.push([point.lng, point.lat]);
      }
      updateUserShapes();
      if (followGps) map.jumpTo({ center: [point.lng, point.lat], zoom: firstFix ? 18 : map.getZoom() });
      status.textContent = 'GPS tracking';
    }

    function onLocationError(error) {
      status.textContent = error.code === 1 ? 'Location denied'
        : error.code === 2 ? 'GPS unavailable' : 'Waiting for GPS';
    }

    function startTracking() {
      if (!map) return;
      if (!navigator.geolocation) {
        status.textContent = 'GPS needs HTTPS';
        return;
      }
      if (watchId !== null) return;
      status.textContent = 'Locating GPS…';
      watchId = navigator.geolocation.watchPosition(onPosition, onLocationError, { enableHighAccuracy: true });
    }

    function stopTracking() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      status.textContent = 'GPS paused';
    }

    live.addEventListener('change', () => {
      if (live.checked) {
        followGps = true;
        if (userPoint) map.flyTo({ center: [userPoint.lng, userPoint.lat], zoom: 18 });
        startTracking();
      } else {
        stopTracking();
      }
    });
    window.addEventListener('pagehide', stopTracking);
    startTracking();

    const grip = document.getElementById('sheetGrip');
    const sheet = document.getElementById('sheet');
    let mapSize = 45, drag = null;
    function setMapSize(size) {
      mapSize = Math.max(18, Math.min(70, size));
      document.body.style.setProperty('--map-size', `${mapSize}%`);
      grip.setAttribute('aria-expanded', String(mapSize < 45));
      if (map) requestAnimationFrame(() => map.resize());
    }
    grip.addEventListener('pointerdown', event => {
      drag = { id: event.pointerId, y: event.clientY, size: mapSize, moved: false };
      grip.setPointerCapture(event.pointerId);
    });
    grip.addEventListener('pointermove', event => {
      if (!drag || event.pointerId !== drag.id) return;
      const delta = event.clientY - drag.y;
      if (Math.abs(delta) > 6) drag.moved = true;
      setMapSize(drag.size + delta / document.body.clientHeight * 100);
    });
    function finishDrag(event) {
      if (!drag || event.pointerId !== drag.id) return;
      const moved = drag.moved;
      drag = null;
      if (!moved) return setMapSize(mapSize < 45 ? 45 : 18);
      setMapSize([18, 45, 70].reduce((nearest, stop) =>
        Math.abs(stop - mapSize) < Math.abs(nearest - mapSize) ? stop : nearest));
    }
    grip.addEventListener('pointerup', finishDrag);
    grip.addEventListener('pointercancel', finishDrag);
    grip.addEventListener('keydown', event => {
      if (event.key === 'ArrowUp') { event.preventDefault(); setMapSize(18); }
      if (event.key === 'ArrowDown') { event.preventDefault(); setMapSize(70); }
    });
  </script>
</body>
</html>
